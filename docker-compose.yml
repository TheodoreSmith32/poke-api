version: "3.9"

services:
  api:
    build: .
    image: poke-api:v1
    container_name: poke-api-container
    ports:
      - "8000:8000"
    restart: always
  postgres:
    image: postgres:15
    container_name: pg-pokemon
    environment:
      POSTGRES_DB: pokemondb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5439:5432"
    mem_limit: 2g